# Debug checks, a failure terminates the sandbox.
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y

# Self-test requirements, irq_offload() is only available in test builds.
CONFIG_TEST=y
CONFIG_IRQ_OFFLOAD=y
